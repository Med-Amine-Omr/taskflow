spring:
  application:
    name: taskflow-api

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${TASKFLOW_DB_NAME}
    username: ${TASKFLOW_DB_USER}
    password: ${TASKFLOW_DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}

server:
  port: ${API_PORT:8081}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    oauth:
      client-id: taskflow-front
      use-pkce-with-authorization-code-grant: true

app:
  timezone: ${APP_TIMEZONE:Africa/Tunis}
  keycloak:
    issuer-uri: ${KEYCLOAK_ISSUER_URI}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
