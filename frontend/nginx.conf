server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Health check du frontend (utilisé par Docker et par l'hébergeur)
    location = /health {
        default_type text/plain;
        return 200 'ok';
    }

    # Configuration d'exécution : jamais en cache (elle dépend de l'environnement)
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # index.html jamais en cache : sinon l'ancienne version resterait après un déploiement
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fichiers du build (nom avec empreinte, ex. index-3f9a1c.js) : cache long
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Application monopage : toute URL inconnue renvoie index.html,
    # puis Vue Router affiche le bon écran
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}